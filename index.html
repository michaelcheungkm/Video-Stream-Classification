<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Camera Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #btn-start {
      font-family: monospace;
      font-size: 14px;
      padding: 10px 24px;
      border: 1px solid #555;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    video {
      width: 100%;
      flex: 1;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    canvas { display: none; }

    #bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #111;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    input {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 3px 6px;
      font-family: monospace;
      font-size: 12px;
    }

    #url { width: 180px; }
    #fps { width: 40px; }

    #btn-stop {
      font-family: monospace;
      font-size: 12px;
      padding: 3px 10px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    #status { color: #888; margin-left: auto; white-space: nowrap; }

    @media (max-width: 600px) and (orientation: portrait) {
      body {
        transform: rotate(90deg);
        transform-origin: bottom left;
        width: 100vh;
        height: 100vw;
        position: fixed;
        bottom: 0; left: 0;
      }
      /* overlay stays fixed to the actual screen, not the rotated body */
      #overlay {
        width: 100vw;
        height: 100vh;
        top: 0; left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="btn-start">Start</button>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="bar">
    <button id="btn-stop">Stop</button>
    <input id="url" type="text" value="http://localhost:5050/frame" spellcheck="false" />
    <input id="fps" type="number" min="1" max="30" value="10" />
    <span id="status">streaming</span>
  </div>

  <script>
    const video   = document.getElementById('video');
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const status  = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const bar     = document.getElementById('bar');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    let intervalId = null;
    let sent = 0;

    async function sendFrame() {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0);
      ctx.restore();

      const b64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
      try {
        await fetch(document.getElementById('url').value.trim(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ frame: b64 }),
        });
        status.textContent = `${++sent} sent`;
      } catch (e) {
        status.textContent = 'error';
      }
    }

    btnStart.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        await video.play();
      } catch { alert('Camera denied'); return; }

      sent = 0;
      const ms = Math.round(1000 / (parseInt(document.getElementById('fps').value) || 10));
      intervalId = setInterval(sendFrame, ms);
      overlay.style.display = 'none';
      bar.style.display = 'flex';
    });

    btnStop.addEventListener('click', () => {
      clearInterval(intervalId);
      video.srcObject?.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      overlay.style.display = 'flex';
      bar.style.display = 'none';
      sent = 0;
    });
  </script>
</body>
</html>
